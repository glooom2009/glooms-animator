# Builds an unsigned iPhone/iPad app (.ipa) of Gloom's Animator from the web version in /app.
# Install it with AltStore, SideStore or Sideloadly (a free Apple ID works; it must be refreshed every 7 days).
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ios.yml']

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wrap the web app for iOS
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('latest.json'))['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir ios-build && cd ios-build
          npm init -y >/dev/null
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/ios@6.2.0
          cp -R ../app www
          npx cap init "Gloom's Animator" com.gloom.animator --web-dir www
          npx cap add ios
          npx cap sync ios
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" $PL
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" $PL
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" $PL || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" $PL || true
      - name: Build (unsigned)
        run: |
          cd ios-build/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -20
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr "$GITHUB_WORKSPACE/GloomsAnimator-iOS-$VERSION.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GloomsAnimator-iOS-${{ env.VERSION }}
          path: GloomsAnimator-iOS-*.ipa
      - name: Attach to the release (if it exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v$VERSION" GloomsAnimator-iOS-*.ipa --clobber || echo "No release v$VERSION yet; the .ipa is in this run's artifacts."
